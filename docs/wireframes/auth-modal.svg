<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Dimmed Background Overlay -->
  <rect x="0" y="0" width="1280" height="880" fill="#000000" fill-opacity="0.75" />

  <!-- Center Auth Modal Card (480px wide) -->
  <g transform="translate(400, 100)">
    <rect x="0" y="0" width="480" height="680" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.6))" />

    <!-- Close Button -->
    <circle cx="445" cy="35" r="14" fill="#334155" />
    <text x="445" y="40" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="middle">✕</text>

    <!-- Logo / Brand Header -->
    <rect x="215" y="40" width="50" height="50" rx="12" fill="url(#orangeGrad)" />
    <text x="240" y="72" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">3S</text>
    
    <text x="240" y="125" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Welcome to 3SAJ Stream</text>
    <text x="240" y="148" fill="#94a3b8" font-size="13" text-anchor="middle">Sign in to sync your anime watchlist and history</text>

    <!-- Auth Tabs (Sign In / Register) -->
    <g transform="translate(40, 175)">
      <rect x="0" y="0" width="400" height="42" rx="8" fill="#0f172a" />
      
      <!-- Sign In Tab (Active) -->
      <rect x="3" y="3" width="195" height="36" rx="6" fill="#334155" />
      <text x="100" y="26" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Sign In</text>

      <!-- Register Tab -->
      <text x="300" y="26" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Register Account</text>
    </g>

    <!-- Form Inputs (FR-1, FR-2) -->
    <g transform="translate(40, 245)">
      <!-- Email / Username Field -->
      <text x="0" y="15" fill="#cbd5e1" font-size="12" font-weight="600">Email or Username</text>
      <rect x="0" y="25" width="400" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="16" y="52" fill="#e2e8f0" font-size="13">kriya.mustafa@example.com</text>

      <!-- Password Field -->
      <text x="0" y="95" fill="#cbd5e1" font-size="12" font-weight="600">Password</text>
      <rect x="0" y="105" width="400" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="16" y="132" fill="#94a3b8" font-size="18">••••••••••••</text>
      <text x="375" y="132" fill="#f97316" font-size="11" text-anchor="end">Show</text>

      <!-- Options Row -->
      <rect x="2" y="165" width="14" height="14" rx="3" fill="#f97316" />
      <text x="24" y="177" fill="#94a3b8" font-size="12">Remember this device</text>
      <text x="400" y="177" fill="#38bdf8" font-size="12" text-anchor="end">Forgot password?</text>

      <!-- Submit Button -->
      <rect x="0" y="200" width="400" height="44" rx="8" fill="url(#orangeGrad)" />
      <text x="200" y="227" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Sign In to 3SAJ Stream</text>
    </g>

    <!-- Quick Role Demo Switcher Box (for Evaluator / Instructor Testing) -->
    <g transform="translate(40, 520)">
      <rect x="0" y="0" width="400" height="110" rx="10" fill="#0f172a" stroke="#f97316" stroke-width="1" stroke-dasharray="4" />
      <text x="20" y="25" fill="#f97316" font-size="11" font-weight="bold">DEMO / EVALUATOR ROLE SWITCHER (CHECK 1)</text>
      <text x="20" y="45" fill="#94a3b8" font-size="11">Click below to immediately log in as any role without typing:</text>

      <!-- Member Button -->
      <rect x="20" y="60" width="170" height="34" rx="6" fill="#334155" />
      <circle cx="36" cy="77" r="5" fill="#38bdf8" />
      <text x="105" y="81" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Log in as Member</text>

      <!-- Admin Button -->
      <rect x="210" y="60" width="170" height="34" rx="6" fill="#334155" />
      <circle cx="226" cy="77" r="5" fill="#ea580c" />
      <text x="295" y="81" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Log in as Admin</text>
    </g>
  </g>

  <!-- Wireframe Annotation Badge -->
  <rect x="1080" y="845" width="180" height="26" rx="4" fill="#334155" />
  <text x="1170" y="862" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">WIREFRAME: AUTH MODAL (FR-1,2)</text>
</svg>
