  <g transform="translate(40, 455)">
    <text x="0" y="18" fill="#ffffff" font-size="18" font-weight="bold">Continue Watching</text>
    <text x="1150" y="18" fill="#f97316" font-size="13" font-weight="500">View All &gt;</text>
    
    <!-- Item 1 -->
    <rect x="0" y="32" width="280" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="0" y="32" width="280" height="100" rx="8" fill="#334155" />
    <text x="140" y="85" fill="#94a3b8" font-size="12" text-anchor="middle">[ Episode Thumbnail ]</text>
    <!-- Progress Bar (65%) -->
    <rect x="10" y="124" width="260" height="4" rx="2" fill="#475569" />
    <rect x="10" y="124" width="170" height="4" rx="2" fill="#f97316" />
    <text x="10" y="152" fill="#ffffff" font-size="13" font-weight="600">Chrono Blades • E12</text>
    <text x="10" y="170" fill="#94a3b8" font-size="11">14:20 / 23:45 remaining</text>

    <!-- Item 2 -->
    <rect x="305" y="32" width="280" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="305" y="32" width="280" height="100" rx="8" fill="#334155" />
    <text x="445" y="85" fill="#94a3b8" font-size="12" text-anchor="middle">[ Episode Thumbnail ]</text>
    <!-- Progress Bar (30%) -->
    <rect x="315" y="124" width="260" height="4" rx="2" fill="#475569" />
    <rect x="315" y="124" width="80" height="4" rx="2" fill="#f97316" />
    <text x="315" y="152" fill="#ffffff" font-size="13" font-weight="600">The Last Sorcerer • E4</text>
    <text x="315" y="170" fill="#94a3b8" font-size="11">07:15 / 24:00 remaining</text>

    <!-- Item 3 -->
    <rect x="610" y="32" width="280" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="610" y="32" width="280" height="100" rx="8" fill="#334155" />
    <text x="750" y="85" fill="#94a3b8" font-size="12" text-anchor="middle">[ Episode Thumbnail ]</text>
    <!-- Progress Bar (90%) -->
    <rect x="620" y="124" width="260" height="4" rx="2" fill="#475569" />
    <rect x="620" y="124" width="235" height="4" rx="2" fill="#f97316" />
    <text x="620" y="152" fill="#ffffff" font-size="13" font-weight="600">Neo Tokyo Express • E8</text>
    <text x="620" y="170" fill="#94a3b8" font-size="11">21:05 / 22:50 remaining</text>

    <!-- Item 4 -->
    <rect x="915" y="32" width="280" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="915" y="32" width="280" height="100" rx="8" fill="#334155" />
    <text x="1055" y="85" fill="#94a3b8" font-size="12" text-anchor="middle">[ Episode Thumbnail ]</text>
    <!-- Progress Bar (15%) -->
    <rect x="925" y="124" width="260" height="4" rx="2" fill="#475569" />
    <rect x="925" y="124" width="40" height="4" rx="2" fill="#f97316" />
    <text x="925" y="152" fill="#ffffff" font-size="13" font-weight="600">Starlight Academy • E1</text>
    <text x="925" y="170" fill="#94a3b8" font-size="11">03:30 / 23:10 remaining</text>
  </g>

  <!-- Popular Series Catalogue Grid (FR-3, FR-5) -->
  <g transform="translate(40, 675)">
    <text x="0" y="18" fill="#ffffff" font-size="18" font-weight="bold">Popular Series Catalogue</text>
    
    <!-- Series Card 1 -->
    <rect x="0" y="32" width="180" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="90" y="95" fill="#94a3b8" font-size="12" text-anchor="middle">[ Poster ]</text>
    <text x="10" y="152" fill="#ffffff" font-size="12" font-weight="bold">Chrono Blades</text>
    <text x="10" y="166" fill="#94a3b8" font-size="10">Sci-Fi • 24 Ep</text>

    <!-- Series Card 2 -->
    <rect x="204" y="32" width="180" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="294" y="95" fill="#94a3b8" font-size="12" text-anchor="middle">[ Poster ]</text>
    <text x="214" y="152" fill="#ffffff" font-size="12" font-weight="bold">The Last Sorcerer</text>
    <text x="214" y="166" fill="#94a3b8" font-size="10">Fantasy • 12 Ep</text>

    <!-- Series Card 3 -->
    <rect x="408" y="32" width="180" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="498" y="95" fill="#94a3b8" font-size="12" text-anchor="middle">[ Poster ]</text>
    <text x="418" y="152" fill="#ffffff" font-size="12" font-weight="bold">Neo Tokyo Express</text>
    <text x="418" y="166" fill="#94a3b8" font-size="10">Cyberpunk • 18 Ep</text>

    <!-- Series Card 4 -->
    <rect x="612" y="32" width="180" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="702" y="95" fill="#94a3b8" font-size="12" text-anchor="middle">[ Poster ]</text>
    <text x="622" y="152" fill="#ffffff" font-size="12" font-weight="bold">Starlight Academy</text>
    <text x="622" y="166" fill="#94a3b8" font-size="10">Music/School • 12 Ep</text>

    <!-- Series Card 5 -->
    <rect x="816" y="32" width="180" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="906" y="95" fill="#94a3b8" font-size="12" text-anchor="middle">[ Poster ]</text>
    <text x="826" y="152" fill="#ffffff" font-size="12" font-weight="bold">Shadow Ronin</text>
    <text x="826" y="166" fill="#94a3b8" font-size="10">Action • 26 Ep</text>

    <!-- Series Card 6 -->
    <rect x="1020" y="32" width="180" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="1110" y="95" fill="#94a3b8" font-size="12" text-anchor="middle">[ Poster ]</text>
    <text x="1030" y="152" fill="#ffffff" font-size="12" font-weight="bold">Dragon Alchemist</text>
    <text x="1030" y="166" fill="#94a3b8" font-size="10">Adventure • 16 Ep</text>
  </g>

  <!-- Wireframe Annotation Badge -->
  <rect x="1100" y="840" width="160" height="26" rx="4" fill="#334155" />
  <text x="1180" y="857" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">WIREFRAME: HOME (FR-3,5)</text>
</svg>
