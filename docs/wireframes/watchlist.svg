      <rect x="12" y="12" width="130" height="86" rx="6" fill="#334155" />
      <text x="77" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">[ Thumbnail ]</text>
      <!-- Progress Bar 60% -->
