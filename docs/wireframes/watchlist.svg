      <rect x="0" y="0" width="180" height="190" rx="8" fill="#334155" />
      <text x="90" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">[ Poster Art ]</text>
      <circle cx="160" cy="20" r="12" fill="#0f172a" fill-opacity="0.8" />
      <text x="160" y="24" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">✕</text>

      <text x="12" y="215" fill="#ffffff" font-size="13" font-weight="bold">Neo Tokyo Express</text>
      <text x="12" y="232" fill="#94a3b8" font-size="11">Cyberpunk • 18 Ep</text>
