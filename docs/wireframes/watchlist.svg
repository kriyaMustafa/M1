      <rect x="12" y="94" width="78" height="4" rx="2" fill="#f97316" />

      <text x="155" y="32" fill="#ffffff" font-size="14" font-weight="bold">Chrono Blades</text>
      <text x="155" y="50" fill="#f97316" font-size="12">S1 : E12 • The Singularity</text>
      <text x="155" y="70" fill="#94a3b8" font-size="11">14:20 of 23:45 remaining</text>

      <rect x="155" y="78" width="90" height="24" rx="4" fill="url(#orangeGrad)" />
      <text x="200" y="94" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Resume ▶</text>
