      <rect x="0" y="0" width="180" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="180" height="190" rx="8" fill="#334155" />
      <text x="90" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">[ Poster Art ]</text>
