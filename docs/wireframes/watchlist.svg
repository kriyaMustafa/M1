      <text x="70" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">My Watchlist (6)</text>

      <!-- Tab 2: Continue Watching -->
      <rect x="155" y="0" width="180" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="245" y="23" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Continue Watching (4)</text>

      <!-- Tab 3: History Log -->
      <rect x="350" y="0" width="140" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="420" y="23" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Watch History</text>
    </g>
