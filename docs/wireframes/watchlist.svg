  <text x="495" y="42" fill="#94a3b8" font-size="14">Admin Portal</text>
  <circle cx="1165" cy="35" r="18" fill="#f97316" />
  <text x="1165" y="41" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">KM</text>

  <!-- Page Header Title & Tabs -->
  <g transform="translate(40, 95)">
    <text x="0" y="32" fill="#ffffff" font-size="28" font-weight="bold">My Library</text>
    <text x="0" y="55" fill="#94a3b8" font-size="14">Manage saved bookmarks and resume partially watched anime</text>

    <!-- Sub-tabs -->
    <g transform="translate(0, 80)">
